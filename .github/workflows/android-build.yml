name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout production web repo
        uses: actions/checkout@v4
        with:
          repository: wuwu0102/hvac-unit-converter
          ref: main
          path: web

      - name: Sync production web into app bundle
        run: |
          mkdir -p app/www
          cp web/index.html app/www/index.html
          cp web/app.js app/www/app.js
          cp web/styles.css app/www/styles.css
          cp -R web/src app/www/src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Pin Capacitor 6 for CI
        working-directory: app
        run: npm install @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2 @capacitor/ios@6.1.2 --save-exact

      - name: Create Android project
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hvac-unit-converter-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
